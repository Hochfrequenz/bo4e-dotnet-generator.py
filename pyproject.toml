[project]
name = "bo4e-dotnet-generator"
description = "Generates C# Classes from JSON schemas for a 100% code-generated BO4E.NEt v2"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hamid Hajiparvaneh", email = "info+github@hochfrequenz.de" }]
keywords = ["BO4E", "Code Generation", "JSON schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer"
    # add all the dependencies here
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/bo4e-dotnet-generator.py/releases"
Homepage = "https://github.com/Hochfrequenz/bo4e-dotnet-generator.py"

[dependency-groups]
tests = [
    "pytest==8.3.4"
]
linting = [
    "ruff==0.16.2"
]
type_check = [
    "mypy==1.13.0",
    { include-group = "tests" }
]
spell_check = [
    "codespell==2.3.0"
]
coverage = [
    "coverage==7.6.9",
    { include-group = "tests" }
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "spell_check" },
    { include-group = "coverage" }
]

[tool.uv]
default-groups = []

[project.scripts]
bo4e-dotnet-generator = "bo4egenerator.cli:cli"
# bo4egenerator is the package in the src directory
# .cli means the cli.py module inside the bo4e-dotnet-generator package
# :cli means the cli function inside the cli.py module


[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "TC",  # flake8-type-checking
    "PIE", # flake8-pie
    "RSE", # flake8-raise
    "ISC", # flake8-implicit-str-concat
    "S",   # flake8-bandit (published library)
]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["bo4egenerator"]

[tool.ruff.lint.per-file-ignores]
# Standing globs (hand-written): tests may use assert and magic values freely.
"unittests/**" = [
    "S101",    # assert-used
    "PLR2004", # magic-value-comparison
]
# Grandfathered existing violations (generated): zero lint churn on pre-existing code.
# New/changed code is held to the full select above. F811 (redefined-while-unused) is
# deliberately NOT grandfathered here - it flags real code and is left for a maintainer decision.
"src/bo4egenerator/cli.py" = [
    "B008",    # function-call-in-default-argument
    "PTH118",  # os-path-join
]
"src/bo4egenerator/generator.py" = [
    "PTH118",  # os-path-join
    "S603",    # subprocess-without-shell-equals-true
]
"unittests/test_duplicates.py" = [
    "PT022",   # pytest-useless-yield-fixture
    "PTH123",  # builtin-open
    "UP015",   # redundant-open-modes
    "UP035",   # deprecated-import
]
"unittests/test_generator.py" = [
    "PTH118",  # os-path-join
]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_bo4e-dotnet-generator_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
