name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  pylint:
    name: Python Code Quality and Lint
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
        linter-env: ["linting", "type_check", "spell_check"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies (linting)
        if: matrix.linter-env == 'linting'
        run: uv sync --group linting
      - name: Install Dependencies (type_check)
        if: matrix.linter-env == 'type_check'
        run: uv sync --group type_check
      - name: Install Dependencies (spell_check)
        if: matrix.linter-env == 'spell_check'
        run: uv sync --group spell_check
      - name: Run pylint
        if: matrix.linter-env == 'linting'
        run: |
          uv run pylint bo4egenerator
          uv run pylint unittests --rcfile=unittests/.pylintrc
      - name: Run mypy
        if: matrix.linter-env == 'type_check'
        run: |
          uv run mypy --show-error-codes src/bo4egenerator --strict
          uv run mypy --show-error-codes unittests --strict
      - name: Run codespell
        if: matrix.linter-env == 'spell_check'
        run: |
          uv run codespell --ignore-words=domain-specific-terms.txt src --skip "src/dotnet-classes,src/schemas"
          uv run codespell --ignore-words=domain-specific-terms.txt README.md
